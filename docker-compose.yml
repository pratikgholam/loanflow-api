services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: loanflow
      POSTGRES_DB: loanflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanflow -d loanflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://loanflow:loanflow@db:5432/loanflow
      SECRET_KEY: dev-secret-not-for-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin-secret-change-me
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
