name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loanflow
          POSTGRES_PASSWORD: loanflow
          POSTGRES_DB: loanflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loanflow -d loanflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Format check (ruff format --check)
        run: |
          source .venv/bin/activate
          ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://loanflow:loanflow@localhost:5432/loanflow
          TEST_DATABASE_URL: postgresql+asyncpg://loanflow:loanflow@localhost:5432/loanflow_test
          SECRET_KEY: ci-test-secret-not-for-production
        run: |
          source .venv/bin/activate
          pytest
